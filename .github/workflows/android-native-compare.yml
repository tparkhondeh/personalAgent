name: Diagnose Android16 native lifecycle on unchanged APKs
on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        type: string
        required: true
      bundle_sha256:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: personal-android-qa
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline44, candidate45]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21
      - name: Verify exact signed comparison inputs
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          BUNDLE_SHA: ${{ inputs.bundle_sha256 }}
          TIA_SIGNED_QA_URL: ${{ secrets.TIA_SIGNED_QA_URL }}
        run: |
          [[ "$CANDIDATE_TAG" =~ ^tia-personal-qa-45-[a-f0-9]{7}$ ]]
          [[ "$BUNDLE_SHA" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p artifacts/personal-signed
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const value=process.env.TIA_SIGNED_QA_URL,u=new URL(value);
          if(u.protocol!=='https:'||u.hostname!=='release-assets.githubusercontent.com')throw Error('Expected exact-asset read capability');
          try{execFileSync('curl',['--fail','--silent','--show-error','--connect-timeout','30','--max-time','300','--config','-','--output','artifacts/signed-qa.zip'],{input:'url = '+JSON.stringify(value)+'\n',stdio:['pipe','pipe','pipe']});}
          catch{throw Error('Signed asset download failed; capability not logged');}
          NODE
          printf '%s  %s\n' "$BUNDLE_SHA" artifacts/signed-qa.zip | sha256sum -c -
          unzip -q artifacts/signed-qa.zip -d artifacts/personal-signed
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          node scripts/verify-personal-android.mjs
          printf '%s  %s\n' '67c010c02f194adc9b90ecec6195720bef2da3612d287c51e3ce87333bd859c3' artifacts/personal-signed/tia-1.0.45.apk | sha256sum -c -
          curl --fail --silent --show-error --connect-timeout 30 --max-time 180 -L https://github.com/tparkhondeh/personalAgent/releases/download/personal-1.0.44/tia-1.0.44.apk -o artifacts/upgrade-from-44.apk
          printf '%s  %s\n' 'fa62f5b0f9e55270fc78f01dc16441162a7ba0e13337a81d8c24d2fcbfbfa377' artifacts/upgrade-from-44.apk | sha256sum -c -
          node scripts/verify-android-upgrade.mjs artifacts/upgrade-from-44.apk artifacts/personal-signed/tia-1.0.45.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash scripts/android-emulator-settle.sh artifacts/native-compare/${{ matrix.variant }}/prepare && bash scripts/android-native-compare.sh '${{ matrix.variant }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-comparison-${{ matrix.variant }}-${{ github.run_id }}
          path: artifacts/native-compare/
          retention-days: 14
