name: Stable offline phone preview

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-offline-phone-preview
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build and publish stable offline APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Run web quality checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Prepare Android and run quality checks
        run: |
          node scripts/generate-android-assets.mjs
          pnpm android:sync
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon :app:lintDebug :app:testDebugUnitTest

      - name: Configure standalone preview identity
        run: |
          preview_package="ir.wealthos.personalagent.offlinepreview${GITHUB_RUN_NUMBER}"
          preview_name="همراه آفلاین ${GITHUB_RUN_NUMBER}"
          export PREVIEW_PACKAGE_ID="$preview_package"
          export PREVIEW_APP_NAME="$preview_name"
          echo "PREVIEW_PACKAGE_ID=$preview_package" >> "$GITHUB_ENV"
          echo "PREVIEW_APP_NAME=$preview_name" >> "$GITHUB_ENV"

          node - <<'NODE'
          const fs = require("node:fs");
          const packageId = process.env.PREVIEW_PACKAGE_ID;
          const appName = process.env.PREVIEW_APP_NAME;
          if (!packageId || !appName) throw new Error("Offline preview identity is missing");

          const gradlePath = "android/app/build.gradle";
          const gradle = fs.readFileSync(gradlePath, "utf8").replace(
            /applicationId\s+"[^"]+"/,
            `applicationId "${packageId}"`,
          );
          fs.writeFileSync(gradlePath, gradle);

          const stringsPath = "android/app/src/main/res/values/strings.xml";
          const strings = fs
            .readFileSync(stringsPath, "utf8")
            .replace(/<string name="app_name">[^<]*<\/string>/, `<string name="app_name">${appName}</string>`)
            .replace(/<string name="title_activity_main">[^<]*<\/string>/, `<string name="title_activity_main">${appName}</string>`)
            .replace(/<string name="package_name">[^<]*<\/string>/, `<string name="package_name">${packageId}</string>`)
            .replace(/<string name="custom_url_scheme">[^<]*<\/string>/, `<string name="custom_url_scheme">${packageId}</string>`);
          fs.writeFileSync(stringsPath, strings);
          NODE

      - name: Build and verify standalone APK
        run: |
          mkdir -p artifacts/offline-preview
          ./android/gradlew -p android --no-daemon :app:assembleDebug
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -p "$apk_path" assets/capacitor.config.json > artifacts/offline-preview/capacitor.config.json
          node - <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("artifacts/offline-preview/capacitor.config.json", "utf8"));
          if (config.server?.url) throw new Error(`Offline APK unexpectedly depends on ${config.server.url}`);
          NODE
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$apk_path" \
            | tee artifacts/offline-preview/aapt-badging.txt
          grep -F "package: name='${PREVIEW_PACKAGE_ID}'" artifacts/offline-preview/aapt-badging.txt
          grep -F "application-label:'${PREVIEW_APP_NAME}'" artifacts/offline-preview/aapt-badging.txt
          cp "$apk_path" "artifacts/offline-preview/hamrah-offline-preview-${GITHUB_RUN_NUMBER}.apk"
          sha256sum "artifacts/offline-preview/hamrah-offline-preview-${GITHUB_RUN_NUMBER}.apk" \
            | tee artifacts/offline-preview/sha256.txt

      - name: Upload verified build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hamrah-offline-preview-${{ github.run_number }}
          path: artifacts/offline-preview/
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable pre-release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="phone-preview-offline-${GITHUB_RUN_NUMBER}"
          apk="artifacts/offline-preview/hamrah-offline-preview-${GITHUB_RUN_NUMBER}.apk"
          gh release create "$tag" "$apk#همراه آفلاین ${GITHUB_RUN_NUMBER}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "همراه آفلاین آزمایشی ${GITHUB_RUN_NUMBER}" \
            --notes "نسخه آزمایشی مستقل از Production و تونل موقت. داده‌ها فقط روی گوشی ذخیره می‌شوند و این Release برای انتشار عمومی نهایی نیست." \
            --prerelease
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/hamrah-offline-preview-${GITHUB_RUN_NUMBER}.apk"
          {
            echo "## Stable offline Android preview"
            echo
            echo "- APK: $download_url"
            echo "- App name: $PREVIEW_APP_NAME"
            echo "- Package ID: $PREVIEW_PACKAGE_ID"
            echo "- SHA-256: $(awk '{print $1}' artifacts/offline-preview/sha256.txt)"
            echo "- Network dependency: none"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'APK_URL=%s\n' "$download_url"
