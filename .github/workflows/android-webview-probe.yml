name: Isolate Android16 framework WebView lifecycle
on:
  workflow_dispatch:
    inputs:
      image:
        type: choice
        default: all
        options: [all, '36', '36.1']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.image == '36.1' && '["36.1"]' || inputs.image == '36' && '["36"]' || '["36","36.1"]') }}
        blank: ['false', 'true']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21
      - name: Build separate framework-only diagnostic
        run: |
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          chmod +x android/gradlew
          ./android/gradlew -p diagnostics/webview-lifecycle --no-daemon assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        if: matrix.image == '36'
        with:
          api-level: 36
          system-image-api-level: ${{ matrix.image }}
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          # Let the existing settle gate handle service readiness; changing the
          # animation setting during early boot fails on some official36.1 images.
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash scripts/android-emulator-settle.sh artifacts/probe/prepare && bash scripts/android-webview-probe.sh '${{ matrix.blank }}'
      - name: Boot official36.1 only after framework services are actually ready
        if: matrix.image == '36.1'
        run: bash scripts/android-webview-probe-boot.sh '${{ matrix.blank }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: webview-probe-${{ matrix.image }}-${{ matrix.blank }}-${{ github.run_id }}
          path: artifacts/probe/
          retention-days: 14
