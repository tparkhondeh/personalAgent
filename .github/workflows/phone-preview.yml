name: Temporary phone preview

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: temporary-phone-preview
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: file:${{ github.workspace }}/data/phone-preview.db
  AI_PROVIDER: openai
  OPENAI_API_KEY: ""
  OPENAI_MODEL: gpt-5-mini
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  VAPID_SUBJECT: mailto:preview@personalagent.invalid

jobs:
  preview:
    name: Build and host installable phone preview
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare isolated database and runtime secrets
        run: |
          mkdir -p data artifacts/phone-preview public/downloads
          pnpm db:generate
          pnpm db:init
          auth_secret=$(openssl rand -hex 32)
          cron_secret=$(openssl rand -hex 32)
          echo "::add-mask::$auth_secret"
          echo "::add-mask::$cron_secret"
          echo "BETTER_AUTH_SECRET=$auth_secret" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$cron_secret" >> "$GITHUB_ENV"

      - name: Create temporary HTTPS preview address
        run: |
          curl --fail --location --retry 5 --retry-delay 3 \
            --output artifacts/phone-preview/pinggy \
            https://github.com/Pinggy-io/cli-js/releases/download/v0.5.6/pinggy-linux-x64
          echo "ffb4c665ec0bf8d22cf147fbcf072dfae560d38e09666a6692c401f35cc2d649  artifacts/phone-preview/pinggy" \
            | sha256sum --check
          chmod +x artifacts/phone-preview/pinggy

          node - <<'NODE' > artifacts/phone-preview/placeholder.log 2>&1 &
          const http = require("node:http");
          http.createServer((request, response) => {
            response.writeHead(200, { "content-type": "application/json; charset=utf-8", "cache-control": "no-store" });
            response.end(JSON.stringify({ status: "preparing" }));
          }).listen(3012, "127.0.0.1");
          NODE
          echo "$!" > artifacts/phone-preview/placeholder.pid

          nohup artifacts/phone-preview/pinggy \
            -l http://127.0.0.1:3012 \
            > artifacts/phone-preview/tunnel.log 2>&1 &
          echo "$!" > artifacts/phone-preview/tunnel.pid

          preview_url=""
          for attempt in {1..60}; do
            preview_url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.free\.pinggy\.net' artifacts/phone-preview/tunnel.log | head -1 || true)
            if [ -n "$preview_url" ]; then
              break
            fi
            if ! kill -0 "$(cat artifacts/phone-preview/tunnel.pid)" 2>/dev/null; then
              cat artifacts/phone-preview/tunnel.log
              exit 1
            fi
            sleep 2
          done
          test -n "$preview_url"

          for attempt in {1..30}; do
            if curl --fail --silent --user-agent 'HamrahPreview/1.0' "$preview_url/api/health" | grep -q '"status":"preparing"'; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --user-agent 'HamrahPreview/1.0' "$preview_url/api/health" | grep -q '"status":"preparing"'

          printf '%s\n' "$preview_url" > artifacts/phone-preview/preview-url.txt
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_URL=$preview_url" >> "$GITHUB_ENV"
          echo "CAPACITOR_SERVER_URL=$preview_url" >> "$GITHUB_ENV"

      - name: Run web quality checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Run Android quality checks
        run: |
          node scripts/generate-android-assets.mjs
          pnpm android:sync
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon :app:lintDebug :app:testDebugUnitTest

      - name: Configure conflict-free preview identity
        run: |
          preview_package="ir.wealthos.personalagent.preview${GITHUB_RUN_NUMBER}"
          preview_name="همراه آزمایشی ${GITHUB_RUN_NUMBER}"
          export PREVIEW_PACKAGE_ID="$preview_package"
          export PREVIEW_APP_NAME="$preview_name"
          echo "PREVIEW_PACKAGE_ID=$preview_package" >> "$GITHUB_ENV"
          echo "PREVIEW_APP_NAME=$preview_name" >> "$GITHUB_ENV"

          node - <<'NODE'
          const fs = require("node:fs");

          const packageId = process.env.PREVIEW_PACKAGE_ID;
          const appName = process.env.PREVIEW_APP_NAME;
          if (!packageId || !appName) {
            throw new Error("Preview identity environment is missing");
          }

          const gradlePath = "android/app/build.gradle";
          const gradle = fs.readFileSync(gradlePath, "utf8").replace(
            /applicationId\s+"[^"]+"/,
            `applicationId "${packageId}"`,
          );
          fs.writeFileSync(gradlePath, gradle);

          const stringsPath = "android/app/src/main/res/values/strings.xml";
          const strings = fs
            .readFileSync(stringsPath, "utf8")
            .replace(/<string name="app_name">[^<]*<\/string>/, `<string name="app_name">${appName}</string>`)
            .replace(/<string name="title_activity_main">[^<]*<\/string>/, `<string name="title_activity_main">${appName}</string>`)
            .replace(/<string name="package_name">[^<]*<\/string>/, `<string name="package_name">${packageId}</string>`)
            .replace(/<string name="custom_url_scheme">[^<]*<\/string>/, `<string name="custom_url_scheme">${packageId}</string>`);
          fs.writeFileSync(stringsPath, strings);

          const capacitorConfigPath = "android/app/src/main/assets/capacitor.config.json";
          const capacitorConfig = JSON.parse(fs.readFileSync(capacitorConfigPath, "utf8"));
          capacitorConfig.android = {
            ...(capacitorConfig.android ?? {}),
            overrideUserAgent: "HamrahPreview/1.0",
          };
          fs.writeFileSync(capacitorConfigPath, `${JSON.stringify(capacitorConfig, null, 2)}\n`);
          NODE

      - name: Build phone APK
        run: |
          ./android/gradlew -p android --no-daemon :app:assembleDebug
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/capacitor.config.json > artifacts/phone-preview/capacitor.config.json
          grep -F "\"url\": \"${PREVIEW_URL}\"" artifacts/phone-preview/capacitor.config.json
          grep -F '"overrideUserAgent": "HamrahPreview/1.0"' artifacts/phone-preview/capacitor.config.json
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -F "package: name='${PREVIEW_PACKAGE_ID}'" \
            | tee artifacts/phone-preview/application-id.txt
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/hamrah-phone-preview.apk
          sha256sum public/downloads/hamrah-phone-preview.apk | tee public/downloads/hamrah-phone-preview.sha256.txt

      - name: Start isolated preview application
        run: |
          kill "$(cat artifacts/phone-preview/placeholder.pid)" 2>/dev/null || true
          mkdir -p .next/standalone/.next .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          cp -R public/. .next/standalone/public/
          HOSTNAME=127.0.0.1 PORT=3012 nohup node .next/standalone/server.js > artifacts/phone-preview/server.log 2>&1 &
          echo "$!" > artifacts/phone-preview/server.pid

          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3012/api/health > artifacts/phone-preview/local-health.json; then
              grep -F '"status":"ok"' artifacts/phone-preview/local-health.json
              grep -F '"database":"connected"' artifacts/phone-preview/local-health.json
              break
            fi
            sleep 2
          done
          grep -F '"status":"ok"' artifacts/phone-preview/local-health.json
          grep -F '"database":"connected"' artifacts/phone-preview/local-health.json

      - name: Verify public preview and install file
        run: |
          for attempt in {1..40}; do
            if curl --fail --silent --user-agent 'HamrahPreview/1.0' "$PREVIEW_URL/api/health" > artifacts/phone-preview/public-health.json; then
              if grep -q '"status":"ok"' artifacts/phone-preview/public-health.json && grep -q '"database":"connected"' artifacts/phone-preview/public-health.json; then
                break
              fi
            fi
            sleep 2
          done
          grep -F '"status":"ok"' artifacts/phone-preview/public-health.json
          grep -F '"database":"connected"' artifacts/phone-preview/public-health.json

          curl --fail --silent --show-error --head \
            --user-agent 'HamrahPreview/1.0' \
            "$PREVIEW_URL/" > artifacts/phone-preview/security-headers.txt
          grep -i '^x-content-type-options: nosniff' artifacts/phone-preview/security-headers.txt
          grep -i '^x-frame-options: DENY' artifacts/phone-preview/security-headers.txt
          grep -i '^strict-transport-security:' artifacts/phone-preview/security-headers.txt

          curl --fail --silent --show-error \
            --user-agent 'HamrahPreview/1.0' \
            --output artifacts/phone-preview/downloaded-preview.apk \
            "$PREVIEW_URL/downloads/hamrah-phone-preview.apk"
          expected_hash=$(awk '{print $1}' public/downloads/hamrah-phone-preview.sha256.txt)
          downloaded_hash=$(sha256sum artifacts/phone-preview/downloaded-preview.apk | awk '{print $1}')
          test "$expected_hash" = "$downloaded_hash"

          signup_status=$(curl --silent --show-error \
            --output artifacts/phone-preview/signup-smoke.json \
            --write-out '%{http_code}' \
            --user-agent 'HamrahPreview/1.0' \
            --header 'content-type: application/json' \
            --data '{"name":"Phone Preview QA","email":"phone-preview@example.invalid","password":"preview-only-password-2026"}' \
            "$PREVIEW_URL/api/auth/sign-up/email")
          test "$signup_status" = "200"

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify visible UI on Android 16
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash -Eeuo pipefail <<'BASH'
            evidence_dir="artifacts/phone-preview/emulator"
            apk_path="public/downloads/hamrah-phone-preview.apk"
            activity_name="${PREVIEW_PACKAGE_ID}/.MainActivity"
            mkdir -p "$evidence_dir"

            collect_evidence() {
              adb shell uiautomator dump /sdcard/hamrah-preview-window.xml > "$evidence_dir/uiautomator-command.txt" 2>&1 || true
              adb pull /sdcard/hamrah-preview-window.xml "$evidence_dir/window.xml" > /dev/null 2>&1 || true
              adb exec-out screencap -p > "$evidence_dir/screen.png" 2>/dev/null || true
              adb logcat -d > "$evidence_dir/logcat.txt" 2>&1 || true
            }
            trap collect_evidence EXIT

            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r "$apk_path"
            adb logcat -c
            adb shell am force-stop "$PREVIEW_PACKAGE_ID"
            adb shell am start -W -n "$activity_name" | tee "$evidence_dir/activity-start.txt"
            grep -Fq 'Status: ok' "$evidence_dir/activity-start.txt"
            sleep 15
            collect_evidence

            test -n "$(adb shell pidof "$PREVIEW_PACKAGE_ID" | tr -d '\r')"
            grep -Eq 'همراه|ورود|ساخت حساب' "$evidence_dir/window.xml"
            if grep -Eq 'ERR_NAME_NOT_RESOLVED|net::ERR_|FATAL EXCEPTION|Uncaught (TypeError|ReferenceError)' "$evidence_dir/logcat.txt"; then
              echo 'The connected Android preview logged a fatal rendering or network error.' >&2
              exit 1
            fi
            BASH

      - name: Publish installable APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hamrah-phone-preview-${{ github.run_number }}
          path: |
            public/downloads/hamrah-phone-preview.apk
            public/downloads/hamrah-phone-preview.sha256.txt
            artifacts/phone-preview/preview-url.txt
            artifacts/phone-preview/application-id.txt
            artifacts/phone-preview/capacitor.config.json
            artifacts/phone-preview/local-health.json
            artifacts/phone-preview/public-health.json
            artifacts/phone-preview/security-headers.txt
            artifacts/phone-preview/emulator/
          if-no-files-found: error
          retention-days: 14

      - name: Publish preview links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          apk_url="$PREVIEW_URL/downloads/hamrah-phone-preview.apk"
          {
            echo "## Temporary Android phone preview"
            echo
            echo "- App: $PREVIEW_URL"
            echo "- APK: $apk_url"
            echo "- App name: $PREVIEW_APP_NAME"
            echo "- Package ID: $PREVIEW_PACKAGE_ID"
            echo "- SHA-256: $(awk '{print $1}' public/downloads/hamrah-phone-preview.sha256.txt)"
            echo "- Availability: approximately 50 minutes from this run"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Temporary Android preview::$apk_url"
          status_payload=$(jq -n \
            --arg state "pending" \
            --arg target_url "$apk_url" \
            --arg description "Temporary Android preview is available for about 50 minutes" \
            --arg context "temporary-phone-preview/${GITHUB_RUN_NUMBER}" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}')
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$status_payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            > /dev/null
          printf 'PREVIEW_READY=%s\nAPK_URL=%s\n' "$PREVIEW_URL" "$apk_url"

      - name: Keep temporary preview online for phone testing
        run: |
          for minute in {1..50}; do
            kill -0 "$(cat artifacts/phone-preview/server.pid)"
            kill -0 "$(cat artifacts/phone-preview/tunnel.pid)"
            curl --fail --silent --user-agent 'HamrahPreview/1.0' "$PREVIEW_URL/api/health" | grep -q '"status":"ok"'
            sleep 60
          done
