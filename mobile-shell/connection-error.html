<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7ff" />
    <title>همراه | بازیابی اتصال</title>
    <style>
      @font-face {
        font-family: Vazirmatn;
        src: url("./Vazirmatn.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }

      :root {
        color-scheme: light dark;
        font-family: Vazirmatn, Tahoma, sans-serif;
        --bg: #f7f7ff;
        --surface: rgba(255, 255, 255, 0.92);
        --text: #303448;
        --muted: #687086;
        --line: #e1e4f1;
        --primary: #5c70b4;
        --primary-soft: #ecefff;
        --mint: #e4f7ee;
        --peach: #ffede3;
        --shadow: 0 24px 64px rgba(79, 85, 127, 0.15);
      }

      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
        color: var(--text);
        background:
          radial-gradient(circle at 88% 8%, #dfe7ff, transparent 42%),
          radial-gradient(circle at 8% 88%, #ddf6eb, transparent 40%),
          var(--bg);
      }

      main {
        width: min(100%, 470px);
        padding: 30px 24px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
      .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(145deg, #aeb9ef, #8bc4b4); font-size: 21px; font-weight: 800; }
      .brand strong { display: block; font-size: 20px; line-height: 1.5; }
      .brand small { color: var(--muted); font-size: 12px; }
      .status { display: inline-flex; padding: 6px 10px; border-radius: 999px; background: var(--peach); color: #815d4d; font-size: 12px; font-weight: 650; }
      h1 { margin: 16px 0 8px; font-size: clamp(27px, 8vw, 31px); line-height: 1.5; }
      p { margin: 0; color: var(--muted); font-size: 15px; line-height: 2; }
      .actions { display: grid; gap: 10px; margin-top: 26px; }
      button { min-height: 50px; padding: 10px 16px; border-radius: 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
      .primary { border: 1px solid var(--primary); background: linear-gradient(135deg, #5c70b4, #527e73); color: #fff; }
      .secondary { border: 1px solid var(--line); background: var(--primary-soft); color: var(--text); }
      button:focus-visible { outline: 3px solid rgba(92, 112, 180, 0.28); outline-offset: 2px; }
      .note { margin-top: 18px; padding: 12px 14px; border-radius: 13px; background: var(--mint); color: #4d6d62; font-size: 12px; line-height: 1.9; }

      @media (prefers-color-scheme: dark) {
        :root { --bg: #13151f; --surface: rgba(28, 30, 42, 0.94); --text: #eff0f8; --muted: #b2b6c9; --line: #393d50; --primary: #9cabe6; --primary-soft: #2c324d; --mint: #213b33; --peach: #3b2b27; --shadow: 0 24px 64px rgba(0, 0, 0, 0.32); }
        body { background: radial-gradient(circle at 88% 8%, #303955, transparent 42%), radial-gradient(circle at 8% 88%, #243b34, transparent 40%), var(--bg); }
        .primary { color: #171925; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="mark" aria-hidden="true">ه</div>
        <div><strong>همراه</strong><small>دستیار شخصی هوشمند</small></div>
      </div>
      <span id="network-status" class="status">اتصال در دسترس نیست</span>
      <h1>اتصال برقرار نشد</h1>
      <p>اینترنت یا سرور فعلاً در دسترس نیست. برنامه سالم است و می‌توانید دوباره تلاش کنید یا وارد بخش محلی شوید.</p>
      <div class="actions">
        <button id="retry" class="primary" type="button">تلاش دوباره</button>
        <button id="offline" class="secondary" type="button">ادامه در حالت محلی</button>
      </div>
      <div class="note">در حالت محلی، اطلاعات فقط روی همین گوشی ذخیره می‌شوند و بعداً حذف یا جایگزین نمی‌شوند.</div>
    </main>
    <script>
      (() => {
        "use strict";
        const status = document.querySelector("#network-status");
        const updateStatus = () => {
          status.textContent = navigator.onLine ? "اینترنت برقرار است؛ سرور پاسخ نمی‌دهد" : "اتصال در دسترس نیست";
        };
        const callRecovery = (method, fallback) => {
          const recovery = window.HamrahRecovery;
          if (recovery && typeof recovery[method] === "function") recovery[method]();
          else fallback();
        };
        const openBundledInterface = async () => {
          const offlineButton = document.querySelector("#offline");
          offlineButton.disabled = true;
          offlineButton.textContent = "در حال باز کردن نسخه محلی";

          try {
            // The connected APK starts on a remote origin, but Capacitor always
            // serves these packaged files from its private localhost origin.
            // Replacing the current document avoids a second top-level WebView
            // navigation, which some Android WebView versions can reject after
            // a remote startup failure.
            const response = await fetch("./index.html", { cache: "no-store" });
            if (!response.ok) throw new Error(`Bundled interface returned ${response.status}`);
            const html = await response.text();
            if (!html.includes('id="task-list"') || !html.includes("./app.js")) {
              throw new Error("Bundled interface is incomplete");
            }

            const recovery = window.HamrahRecovery;
            if (recovery && typeof recovery.offlineReady === "function") recovery.offlineReady();
            history.replaceState({ mode: "local" }, "", "./index.html?mode=local");
            document.open();
            document.write(html);
            document.close();
          } catch (error) {
            offlineButton.disabled = false;
            offlineButton.textContent = "ادامه در حالت محلی";
            status.textContent = "بازکردن نسخه محلی کامل نشد؛ دوباره تلاش کنید";
            console.error("Hamrah bundled interface failed", error);
          }
        };
        window.HamrahOpenBundledInterface = openBundledInterface;
        document.querySelector("#retry").addEventListener("click", () => callRecovery("retry", () => history.back()));
        document.querySelector("#offline").addEventListener("click", () => void openBundledInterface());
        window.addEventListener("online", updateStatus);
        window.addEventListener("offline", updateStatus);
        updateStatus();
      })();
    </script>
  </body>
</html>
