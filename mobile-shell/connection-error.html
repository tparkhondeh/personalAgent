      :root {
        color-scheme: light dark;
        font-family: Vazirmatn, Tahoma, sans-serif;
        --bg: #f7f7ff;
        --surface: rgba(255, 255, 255, 0.92);
        --text: #303448;
        --muted: #687086;
        --line: #e1e4f1;
        --primary: #5c70b4;
        --primary-soft: #ecefff;
        --mint: #e4f7ee;
        --peach: #ffede3;
        --shadow: 0 24px 64px rgba(79, 85, 127, 0.15);
      }

      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
        color: var(--text);
        background:
          radial-gradient(circle at 88% 8%, #dfe7ff, transparent 42%),
          radial-gradient(circle at 8% 88%, #ddf6eb, transparent 40%),
          var(--bg);
      }

      main {
        width: min(100%, 470px);
        padding: 30px 24px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
      .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(145deg, #aeb9ef, #8bc4b4); font-size: 21px; font-weight: 800; }
      .brand strong { display: block; font-size: 20px; line-height: 1.5; }
      .brand small { color: var(--muted); font-size: 12px; }
      .status { display: inline-flex; padding: 6px 10px; border-radius: 999px; background: var(--peach); color: #815d4d; font-size: 12px; font-weight: 650; }
      h1 { margin: 16px 0 8px; font-size: clamp(27px, 8vw, 31px); line-height: 1.5; }
      p { margin: 0; color: var(--muted); font-size: 15px; line-height: 2; }
      .actions { display: grid; gap: 10px; margin-top: 26px; }
      button { min-height: 50px; padding: 10px 16px; border-radius: 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
      .primary { border: 1px solid var(--primary); background: linear-gradient(135deg, #5c70b4, #527e73); color: #fff; }
      .secondary { border: 1px solid var(--line); background: var(--primary-soft); color: var(--text); }
      button:focus-visible { outline: 3px solid rgba(92, 112, 180, 0.28); outline-offset: 2px; }
      .note { margin-top: 18px; padding: 12px 14px; border-radius: 13px; background: var(--mint); color: #4d6d62; font-size: 12px; line-height: 1.9; }

      @media (prefers-color-scheme: dark) {
        :root { --bg: #13151f; --surface: rgba(28, 30, 42, 0.94); --text: #eff0f8; --muted: #b2b6c9; --line: #393d50; --primary: #9cabe6; --primary-soft: #2c324d; --mint: #213b33; --peach: #3b2b27; --shadow: 0 24px 64px rgba(0, 0, 0, 0.32); }
        body { background: radial-gradient(circle at 88% 8%, #303955, transparent 42%), radial-gradient(circle at 8% 88%, #243b34, transparent 40%), var(--bg); }
        .primary { color: #171925; }
      }
    </style>
