<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ef" />
    <title>همراه</title>
    <style>
      @font-face {
        font-family: Vazirmatn;
        src: url("./Vazirmatn.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      :root { color-scheme: light dark; font-family: Vazirmatn, Tahoma, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; margin: 0; padding: 24px; background: #f6f3ef; color: #27312b; }
      main { width: min(100%, 430px); padding: 32px 26px; border: 1px solid #dce3dc; border-radius: 26px; background: #fffdfa; box-shadow: 0 22px 60px rgba(48, 63, 52, .1); text-align: center; }
      .mark { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 19px; background: #dcebdc; color: #526957; font-size: 25px; font-weight: 800; }
      h1 { margin: 0 0 10px; font-size: 28px; line-height: 1.55; }
      p { margin: 0; color: #647169; font-size: 15px; line-height: 2; }
      small { display: block; margin-top: 22px; color: #7b877f; font-size: 12px; line-height: 1.9; }
      @media (prefers-color-scheme: dark) {
        body { background: #151b17; color: #edf2ed; }
        main { border-color: #364139; background: #1d2520; }
        .mark { background: #2c3b30; color: #cfe0d0; }
        p, small { color: #aebbb2; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ه</div>
      <h1>همراه آماده اتصال است</h1>
      <p>پوسته امن اندروید نصب شده است. برای نسخه آزمایشی، برنامه به سرور لوکال توسعه متصل می‌شود.</p>
      <small>نسخه انتشار فقط با آدرس امن HTTPS و پس از تأیید نهایی Production ساخته خواهد شد.</small>
    </main>
  </body>
</html>
